name: Hourly X Maintenance Alert

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-x-maintenance-alert
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r blackbox_bot/requirements.txt

      - name: Check recent X maintenance posts and send card
        run: python -u scripts/check_hourly_x_maintenance.py
        env:
          HEYCHAT_BOT_TOKEN: ${{ secrets.HEYCHAT_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai

      - name: Save deduplication state
        if: always()
        run: |
          if [ ! -f data/hourly_x_maintenance_state.json ]; then
            echo "No state file created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hourly_x_maintenance_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update hourly X maintenance deduplication state"
          git push
