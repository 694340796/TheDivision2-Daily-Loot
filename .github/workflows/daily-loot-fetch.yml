name: Daily Loot Fetch

on:
  # 08:01 UTC = 北京时间 16:01
  schedule:
    - cron: "1 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-loot-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch latest loot JSON
        run: python scripts/fetch_daily_loot.py
        env:
          LOOT_RETRIES: "5"
          LOOT_RETRY_SECONDS: "60"
          TZ: Asia/Shanghai

      - name: Commit fixed daily data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "全境封锁2恶化掉落/每日掉落.json"
          if git diff --cached --quiet; then
            echo "Daily loot data unchanged."
            exit 0
          fi
          git commit -m "chore: update daily loot snapshot"
          git push
