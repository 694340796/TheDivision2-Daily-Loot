
name: The Division 2 Daily Loot

on:
  schedule:
    - cron: "0 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-loot-update
  cancel-in-progress: false

jobs:
  update-loot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update daily loot
        run: python scripts/update_loot.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "history/全境封锁2每日掉落.py"
          git add data/latest.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "更新全境封锁2每日掉落"
          git push
