name: Blackbox Bot

on:
  # GitHub Actions schedule 最短间隔：5 分钟
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# 保证同一时间只运行一个机器人实例；后续定时任务排队接续。
concurrency:
  group: blackbox-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    # GitHub-hosted runner 单个 job 最长 6 小时，这里预留 10 分钟退出余量。
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: blackbox_bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r blackbox_bot/requirements.txt

      - name: Check bot token
        env:
          HEYCHAT_BOT_TOKEN: ${{ secrets.HEYCHAT_BOT_TOKEN }}
        run: |
          if [ -z "$HEYCHAT_BOT_TOKEN" ]; then
            echo "::error::请在 Settings > Secrets and variables > Actions 中添加 HEYCHAT_BOT_TOKEN"
            exit 1
          fi

      - name: Start Blackbox bot
        run: python -u -m blackbox_bot.main
        env:
          HEYCHAT_BOT_TOKEN: ${{ secrets.HEYCHAT_BOT_TOKEN }}
          HEYCHAT_COMMAND_ID: "2124398728264114176"
          LOOT_REPOSITORY: "694340796/TheDivision2-Daily-Loot"
          LOOT_BRANCH: "main"
          LOOT_DATA_PATH: "history/全境封锁2每日掉落.py"
          PYTHONUNBUFFERED: "1"
