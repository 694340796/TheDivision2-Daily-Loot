name: Blackbox Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blackbox-bot
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: blackbox_bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r blackbox_bot/requirements.txt

      - name: Check bot token
        env:
          HEYCHAT_BOT_TOKEN: ${{ secrets.HEYCHAT_BOT_TOKEN }}
        run: |
          if [ -z "$HEYCHAT_BOT_TOKEN" ]; then
            echo "::error::请在仓库 Secrets 中设置 HEYCHAT_BOT_TOKEN"
            exit 1
          fi

      - name: Listen for subscription command
        run: python -u -m blackbox_bot.main
        env:
          HEYCHAT_BOT_TOKEN: ${{ secrets.HEYCHAT_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEYCHAT_COMMAND_ID: "2124398728264114176"
          LOOT_REPOSITORY: "694340796/TheDivision2-Daily-Loot"
          LOOT_BRANCH: "main"
          PYTHONUNBUFFERED: "1"
