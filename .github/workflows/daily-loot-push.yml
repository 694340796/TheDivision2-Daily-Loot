name: Daily Loot Push

on:
  # 仅在每日掉落获取工作流结束后自动触发，不设置固定运行时间，也不提供独立手动触发。
  workflow_run:
    workflows:
      - Daily Loot Fetch
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: daily-loot-push
  cancel-in-progress: false

jobs:
  push:
    # 获取工作流必须成功完成；失败或取消时不发送旧数据。
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait 5 seconds after fetch workflow completion
        run: sleep 5

      # 获取工作流提交数据后再 checkout，确保读取最新掉落文件。
      - name: Checkout latest repository data
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install bot dependency
        run: python -m pip install --disable-pip-version-check -r blackbox_bot/requirements.txt

      - name: Send daily loot to subscribed channel
        run: python scripts/send_daily_loot.py
        env:
          HEYCHAT_BOT_TOKEN: ${{ secrets.HEYCHAT_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
