
name: The Division 2 Daily Loot

on:
  schedule:
    # 每天北京时间 16:00（UTC 08:00）
    - cron: "0 8 * * *"

  # 支持手动执行，方便测试
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-loot-update
  cancel-in-progress: false

jobs:
  update-loot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and update daily loot
        run: python scripts/update_loot.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json history/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Division 2 daily loot"
          git push
